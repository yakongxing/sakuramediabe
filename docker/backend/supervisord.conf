[supervisord]
logfile=/data/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/data/logs
nodaemon=true
user=root

[inet_http_server]
port=*:9001

[program:api]
directory=/app
command=uvicorn src.api.app:app --workers 1 --host 0.0.0.0 --port 8000 --log-config /app/src/api/uvicorn_config.json
autostart=true
autorestart=true
; stderr 合并进 stdout，避免两套轮转逻辑切割同一个文件互相覆盖。
redirect_stderr=true
stdout_logfile=/data/logs/api.log
; maxbytes 控制单文件大小上限，backups 控制保留的滚动份数；置 0 会关闭轮转导致日志无限增长。
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
killasgroup=true
stopasgroup=true
; 以 root 运行：HOME 为 /root，libpq 探测 $HOME/.postgresql/postgresql.crt 时得到 ENOENT
; （文件不存在），会静默跳过；如果以 user=app 且 HOME 继承为 /root（700 owned by root），
; 会得到 EACCES 直接失败。所以要么显式设 HOME=/home/app 并 user=app，要么直接跑 root。
user=root
environment=PYTHONPATH=/app


[program:aps]
directory=/app
command=python -m src.start.commands aps
autostart=true
autorestart=true
; stderr 合并进 stdout，避免两套轮转逻辑切割同一个文件互相覆盖。
redirect_stderr=true
stdout_logfile=/data/logs/aps.log
; maxbytes 控制单文件大小上限，backups 控制保留的滚动份数；置 0 会关闭轮转导致日志无限增长。
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
killasgroup=true
user=root
stopasgroup=true
environment=PYTHONPATH=/app
