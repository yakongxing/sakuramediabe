[supervisord]
logfile=/data/logs/supervisord.log
; supervisord 自身只记录进程启停事件，量很小；50MB×10 的额度会和媒体数据抢同一个 volume。
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/data/logs
nodaemon=true
; 必须以 root 运行：entrypoint 依赖 root 完成 PUID/PGID 重映射，子进程再各自降权到 app。
user=root

[inet_http_server]
port=*:9001

[program:api]
directory=/app
command=uvicorn src.api.app:app --workers 1 --host 0.0.0.0 --port 8000 --log-config /app/src/api/uvicorn_config.json
autostart=true
autorestart=true
; API 进程要 import 全部插件，起步比默认 1s 慢；给 10s 才判定 RUNNING，
; 否则 import 期崩溃会被误记为"启动成功后退出"，掩盖真实错误。
startsecs=10
startretries=3
priority=10
; stderr 合并进 stdout，避免两套轮转逻辑切割同一个文件互相覆盖。
redirect_stderr=true
stdout_logfile=/data/logs/api.log
; maxbytes 控制单文件大小上限，backups 控制保留的滚动份数；置 0 会关闭轮转导致日志无限增长。
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
; uvicorn 收到 SIGTERM 会等已建立的连接收尾；媒体 Range 响应可能正在传大文件，
; 默认 10s 太短会被 SIGKILL 打断。容器侧需配合 `docker stop -t 30` 或 compose 的 stop_grace_period。
stopsignal=TERM
stopwaitsecs=25
killasgroup=true
stopasgroup=true
user=app
environment=PYTHONPATH=/app


[program:aps]
directory=/app
command=python -m src.start.commands aps
autostart=true
autorestart=true
; 调度器同样要加载插件后才进入主循环。
startsecs=10
startretries=3
; 晚于 api 启动：两者共享 DB，让 api 先完成连接自检，失败时日志更容易定位。
priority=20
; stderr 合并进 stdout，避免两套轮转逻辑切割同一个文件互相覆盖。
redirect_stderr=true
stdout_logfile=/data/logs/aps.log
; maxbytes 控制单文件大小上限，backups 控制保留的滚动份数；置 0 会关闭轮转导致日志无限增长。
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
; 调度器可能正在跑 ffmpeg 抽帧等外部进程，stopasgroup 保证整个进程组一起收到信号，
; 否则 ffmpeg 会变成孤儿进程继续占 CPU 和磁盘。
stopsignal=TERM
stopwaitsecs=25
killasgroup=true
stopasgroup=true
user=app
environment=PYTHONPATH=/app
